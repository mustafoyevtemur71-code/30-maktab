backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "yangiliklar"
    label: "Maktab Hayoti va Yangiliklar"
    folder: "content/yangiliklar"
    create: true
    fields:
      - {label: "Sarlavha", name: "title", widget: "string"}
      - {label: "Sana", name: "date", widget: "date"}
      - {label: "Rasm", name: "image", widget: "image"}
      - {label: "Matn", name: "body", widget: "markdown"}
